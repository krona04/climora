architectury {
    common rootProject.enabled_platforms.split(',')
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Particle Rain: only the classes the compatibility hooks call. Never bundled, never required.
    // Its NeoForge jar already has Mojang's names, so it needs no remapping (Loom 1.10 refuses its Fabric jar,
    // built with a newer Loom).
    compileOnly("maven.modrinth:particle-rain:$rootProject.particle_rain_neoforge_version") { transitive = false }

    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    testImplementation platform('org.junit:junit-bom:5.10.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

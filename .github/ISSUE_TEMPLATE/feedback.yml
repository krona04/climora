name: Отзыв
description: Впечатления от погоды, идеи и пожелания
title: "[Feedback] "
labels: ["feedback", "tech-demo"]
body:
  - type: textarea
    id: impressions
    attributes:
      label: Впечатления
      description: Как выглядит и ощущается погода? Что понравилось, что нет?
    validations:
      required: true
  - type: dropdown
    id: rain
    attributes:
      label: Как часто идут дожди (после /climora weather auto)
      options: ["Слишком часто", "В самый раз", "Слишком редко", "Не проверял"]
  - type: input
    id: biomes
    attributes:
      label: В каких биомах играли
  - type: textarea
    id: ideas
    attributes:
      label: Идеи

name: Баг
description: Краш, ошибка или что-то выглядит сломанным
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Версия Climora
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Загрузчик
      options: ["Fabric", "NeoForge"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что произошло
      description: Что вы делали, что ожидали увидеть и что увидели. Скриншот очень помогает.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: |
        1. Создать мир
        2. /climora weather storm
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Лог или краш-репорт
      description: Прикрепите `logs/latest.log` или файл из `crash-reports`.
  - type: textarea
    id: mods
    attributes:
      label: Другие моды

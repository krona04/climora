name: Отчёт о производительности
description: Результаты теста производительности тех-демо (docs/TESTING.md, шаги 1–2)
title: "[Perf] "
labels: ["performance", "tech-demo"]
body:
  - type: input
    id: version
    attributes:
      label: Версия Climora
      placeholder: "0.1"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Загрузчик
      options: ["Fabric", "NeoForge"]
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Где тестировали
      options: ["Одиночная игра", "Выделенный сервер"]
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Процессор, видеокарта, выделенная память
      placeholder: "Ryzen 5 5600, RTX 3060, 6 ГБ"
  - type: textarea
    id: server
    attributes:
      label: /climora stats
      description: Вывод без нагрузки, со `stress 3` и после быстрого полёта.
      render: text
    validations:
      required: true
  - type: textarea
    id: client
    attributes:
      label: FPS
      description: Ясно / облачно / дождь / гроза, дальность прорисовки и настройки графики.
  - type: input
    id: players
    attributes:
      label: Сколько игроков было на сервере
  - type: textarea
    id: mods
    attributes:
      label: Другие моды
      description: Особенно Sodium, Iris, шейдеры, моды на погоду, биомы и сезоны.

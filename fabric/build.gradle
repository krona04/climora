plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = file('src/main/resources/climora.accesswidener')

    runs {
        client {
            // Automated screenshot scenario for development: ./gradlew :fabric:runClient -PclimoraHarness=weather
            if (project.hasProperty('climoraHarness')) {
                vmArg "-Dclimora.harness=${project.property('climoraHarness')}"
            }
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }

    // Production mod jars loaded as-is in development runs, see climoraRenderer below.
    renderModsRaw {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Rendering mods for compatibility checks, development runs only and never shipped:
    // ./gradlew :fabric:runClient -PclimoraRenderer=sodium   (or =iris, which brings Sodium along)
    def renderer = project.findProperty('climoraRenderer')
    if (renderer == 'sodium' || renderer == 'iris') {
        modLocalRuntime "maven.modrinth:sodium:$rootProject.sodium_version"
    }
    if (renderer == 'iris') {
        modLocalRuntime "maven.modrinth:iris:$rootProject.iris_version"
    }
    // Sodium 0.8 is built with a newer Loom than ours can remap, so it is handed to Fabric Loader as a
    // production jar instead; the loader remaps it at startup. -PclimoraRenderer=sodium8
    if (renderer == 'sodium8') {
        renderModsRaw "maven.modrinth:sodium:$rootProject.sodium8_version"
    }

    def compat = (project.findProperty('climoraCompat') ?: '').toString().split(',')
    if ('particlerain' in compat) {
        // Built with a newer Loom: loaded through -Dfabric.addMods, like Sodium 0.8.
        renderModsRaw "maven.modrinth:particle-rain:$rootProject.particle_rain_version"
    }
    if ('soundphysics' in compat) {
        renderModsRaw "maven.modrinth:sound-physics-remastered:$rootProject.sound_physics_version"
    }

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

tasks.named('runClient') {
    def raw = configurations.renderModsRaw
    doFirst {
        if (!raw.isEmpty()) {
            jvmArgs "-Dfabric.addMods=${raw.files.join(File.pathSeparator)}"
        }
    }
}
